<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3d8f"/>
      <stop offset="0.5" stop-color="#1565d8"/>
      <stop offset="1" stop-color="#5fb1f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#hbg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- AC unit illustration on right -->
  <g transform="translate(1000, 280)">
    <rect x="0" y="0" width="420" height="140" rx="20" fill="#ffffff" opacity="0.95"/>
    <rect x="0" y="100" width="420" height="40" rx="10" fill="#dceaf9"/>
    <rect x="30" y="30" width="360" height="8" rx="4" fill="#cfdcec"/>
    <rect x="30" y="50" width="240" height="6" rx="3" fill="#e5edf6"/>
    <circle cx="370" cy="50" r="6" fill="#5fb1f5"/>
    <!-- airflow -->
    <path d="M40 180 Q60 240 30 300" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M120 180 Q140 260 100 340" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M210 180 Q230 280 200 380" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M300 180 Q320 260 290 340" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M380 180 Q400 240 370 300" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <!-- snowflake decorations -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="200" cy="180" r="5"/>
    <circle cx="320" cy="120" r="3"/>
    <circle cx="450" cy="220" r="4"/>
    <circle cx="600" cy="160" r="3"/>
    <circle cx="800" cy="200" r="5"/>
    <circle cx="150" cy="320" r="4"/>
    <circle cx="280" cy="420" r="3"/>
    <circle cx="500" cy="500" r="5"/>
    <circle cx="700" cy="600" r="3"/>
    <circle cx="900" cy="700" r="4"/>
  </g>
</svg>
