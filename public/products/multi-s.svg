<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#f8fbff"/>
  <!-- single outdoor unit -->
  <rect x="40" y="170" width="110" height="100" rx="8" fill="#ffffff" stroke="#cfdcec" stroke-width="2"/>
  <circle cx="95" cy="220" r="32" fill="#eef5fc"/>
  <circle cx="95" cy="220" r="22" fill="#ffffff" stroke="#cfdcec"/>
  <path d="M95 198 L95 242 M73 220 L117 220 M79 204 L111 236 M111 204 L79 236" stroke="#5fb1f5" stroke-width="2" stroke-linecap="round"/>
  <text x="95" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">1 cục nóng</text>
  <!-- 4 small indoor units -->
  <g>
    <rect x="200" y="80" width="160" height="36" rx="6" fill="#ffffff" stroke="#cfdcec"/>
    <rect x="200" y="100" width="160" height="14" rx="3" fill="#eef5fc"/>
    <rect x="200" y="135" width="160" height="36" rx="6" fill="#ffffff" stroke="#cfdcec"/>
    <rect x="200" y="155" width="160" height="14" rx="3" fill="#eef5fc"/>
    <rect x="200" y="190" width="160" height="36" rx="6" fill="#ffffff" stroke="#cfdcec"/>
    <rect x="200" y="210" width="160" height="14" rx="3" fill="#eef5fc"/>
    <rect x="200" y="245" width="160" height="36" rx="6" fill="#ffffff" stroke="#cfdcec"/>
    <rect x="200" y="265" width="160" height="14" rx="3" fill="#eef5fc"/>
  </g>
  <!-- connecting pipe -->
  <path d="M150 220 L200 100 M150 220 L200 155 M150 220 L200 210 M150 220 L200 265" stroke="#bcd3ea" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
  <rect x="135" y="320" width="130" height="22" rx="4" fill="#eef5fc"/>
  <text x="200" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1565d8">MULTI S COMBO</text>
</svg>
